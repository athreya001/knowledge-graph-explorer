<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A client-side explorer for the Google Knowledge Graph API. Search entities, view JSON data, and explore relationships.">
  <title>Knowledge Graph Explorer</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
  
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <style>
    /* JSON Syntax Highlighting */
    .json-key { color: #d946ef; } /* Fuchsia-500 */
    .json-value { color: #3b82f6; } /* Blue-500 */
    .json-string { color: #22c55e; } /* Green-500 */
    .dark .json-key { color: #e879f9; }
    .dark .json-value { color: #60a5fa; }
    .dark .json-string { color: #4ade80; }
    
    pre { white-space: pre-wrap; word-wrap: break-word; }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .dark ::-webkit-scrollbar-thumb { background: #475569; }
    .dark ::-webkit-scrollbar-thumb:hover { background: #64748b; }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translate3d(0, 20px, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    .animate-fade-in-up { animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    
    @keyframes shimmer {
      0% { background-position: -1000px 0; }
      100% { background-position: 1000px 0; }
    }
    .skeleton {
      background: linear-gradient(to right, #f1f5f9 4%, #e2e8f0 25%, #f1f5f9 36%);
      background-size: 1000px 100%;
      animation: shimmer 2s infinite linear;
    }
    .dark .skeleton {
      background: linear-gradient(to right, #1e293b 4%, #334155 25%, #1e293b 36%);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans transition-colors duration-300 dark:bg-slate-900 dark:text-slate-100 flex flex-col">
  
  <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-3 pointer-events-none"></div>

  <header class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 sticky top-0 z-40 transition-colors duration-300">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href=window.location.pathname">
        <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
          <i class="fa-solid fa-project-diagram text-xl"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold leading-none tracking-tight">KG Explorer</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400 font-mono mt-1">Google Knowledge Graph API</p>
        </div>
      </div>
      
      <div class="flex items-center gap-3">
        <a href="https://github.com/athreya001/knowledge-graph-explorer" target="_blank" rel="noopener noreferrer" class="p-2 text-slate-400 hover:text-slate-800 dark:hover:text-white transition-colors">
          <i class="fa-brands fa-github text-xl"></i>
        </a>
        <button id="themeToggle" class="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-yellow-400 hover:bg-slate-200 dark:hover:bg-slate-600 transition-all focus:outline-none focus:ring-2 focus:ring-blue-500">
          <i class="fa-solid fa-moon dark:hidden"></i>
          <i class="fa-solid fa-sun hidden dark:inline"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
    
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 mb-8 transition-colors duration-300">
      
      <div id="apiKeyNote" class="hidden mb-4 bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 rounded-lg px-3 py-2 text-xs text-amber-800 dark:text-amber-200 flex items-center gap-2">
        <i class="fa-solid fa-shield-halved"></i>
        <div class="flex-1">
          <strong id="apiKeyNoteTitle">Demo API Key Active:</strong>
          <span id="apiKeyNoteText">Public demo key is used automatically.</span>
        </div>
        <button onclick="document.getElementById('apiKeyNote').classList.add('hidden')" class="hover:text-amber-900 dark:hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="grid gap-5 md:grid-cols-[1fr_auto]">
        <div class="relative">
          <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5">Search Query</label>
          <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 z-10"></i>
            <input type="text" id="searchQuery"
              class="w-full pl-10 pr-10 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all dark:text-white"
              placeholder="e.g. Taylor Swift OR kg:/m/05f4p"
              oninput="toggleClearBtn()">
            <button id="clearSearchBtn" onclick="clearSearch()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-red-500 hidden transition-colors">
              <i class="fa-solid fa-circle-xmark"></i>
            </button>
          </div>
        </div>

        <div class="flex items-end">
          <button onclick="initiateSearch()" id="searchBtn"
            class="h-[46px] px-8 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-lg shadow-blue-500/30 hover:shadow-blue-500/50 transition-all flex items-center gap-2 active:scale-95 w-full md:w-auto justify-center">
            <span>Explore</span>
            <i class="fa-solid fa-rocket"></i>
          </button>
        </div>
      </div>

      <div id="recentSearchesContainer" class="hidden mt-4 pt-4 border-t border-slate-100 dark:border-slate-700">
        <div class="flex items-center gap-2 overflow-x-auto pb-2" id="recentSearchesList"></div>
      </div>

      <div class="mt-4 pt-4 border-t border-slate-100 dark:border-slate-700">
        <details class="group">
          <summary class="flex items-center gap-2 text-xs font-semibold text-slate-500 dark:text-slate-400 cursor-pointer hover:text-blue-600 dark:hover:text-blue-400 transition-colors select-none">
            <i class="fa-solid fa-sliders transition-transform group-open:rotate-180"></i>
            <span>FILTER PARAMETERS</span>
          </summary>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4 animate-fade-in-up">
            <div>
              <label class="block text-[10px] uppercase text-slate-400 mb-1">Limit</label>
              <input type="number" id="limit" min="1" max="50" placeholder="Optional" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm dark:text-white focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
              <label class="block text-[10px] uppercase text-slate-400 mb-1">Languages (Comma separated)</label>
              <input type="text" id="languages" placeholder="e.g. en, fr, ja" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm dark:text-white focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div class="col-span-2 md:col-span-2">
              <label class="block text-[10px] uppercase text-slate-400 mb-1">Types (Comma separated)</label>
              <input type="text" id="types" placeholder="e.g. Person, Organization" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm dark:text-white focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
          </div>
        </details>
      </div>
    </div>

    <div id="resultsWrapper">
      
      <div id="skeletonLoader" class="hidden grid-cols-1 gap-6">
        <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 overflow-hidden">
          <div class="p-6 space-y-4">
            <div class="h-6 w-1/3 bg-slate-200 dark:bg-slate-700 rounded skeleton"></div>
            <div class="h-4 w-1/4 bg-slate-200 dark:bg-slate-700 rounded skeleton"></div>
            <div class="h-16 w-full bg-slate-200 dark:bg-slate-700 rounded skeleton"></div>
          </div>
        </div>
        <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 overflow-hidden">
          <div class="p-6 space-y-4">
            <div class="h-6 w-1/3 bg-slate-200 dark:bg-slate-700 rounded skeleton"></div>
            <div class="h-4 w-1/4 bg-slate-200 dark:bg-slate-700 rounded skeleton"></div>
            <div class="h-16 w-full bg-slate-200 dark:bg-slate-700 rounded skeleton"></div>
          </div>
        </div>
      </div>

      <div id="resultControls" class="hidden flex justify-between items-center mb-4 px-1 animate-fade-in-up">
        <div id="countHeader" class="text-sm text-slate-500 dark:text-slate-400"></div>
        <button onclick="downloadAllResults()" class="text-xs bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 px-3 py-1.5 rounded-lg transition-all flex items-center gap-2 shadow-sm">
          <i class="fa-solid fa-download"></i> Download JSON
        </button>
      </div>

      <div id="resultsContainer" class="grid grid-cols-1 gap-6 pb-20">
        <div class="text-center py-20 opacity-50">
          <i class="fa-solid fa-diagram-project text-6xl text-slate-300 dark:text-slate-600 mb-4"></i>
          <p class="text-slate-400 dark:text-slate-500 text-lg">Enter a query to start exploring.</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 py-6 mt-auto">
    <div class="max-w-6xl mx-auto px-4 text-center">
      <p class="text-xs text-slate-400 dark:text-slate-500">
        Not affiliated with Google. Data provided via Google Knowledge Graph API.
        <br>Run entirely in your browser.
      </p>
    </div>
  </footer>

  <div id="jsonModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4 transition-all duration-300">
    <div class="bg-white dark:bg-slate-800 w-full max-w-4xl max-h-[85vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-fade-in-up border border-slate-200 dark:border-slate-700">
      <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-800/50">
        <h3 class="font-bold text-slate-700 dark:text-slate-200 flex items-center gap-2 font-mono text-sm">
          <i class="fa-solid fa-code text-blue-500"></i> Raw Response
        </h3>
        <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-400 transition-colors">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="overflow-auto p-0 flex-1 bg-[#f8f9fa] dark:bg-[#0d1117]">
        <pre id="modalContent" class="text-xs font-mono p-6"></pre>
      </div>
      <div class="p-4 border-t border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 flex justify-end">
        <button id="copyBtn" onclick="copyModalContent()" class="text-xs font-semibold text-blue-600 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/30 px-4 py-2 rounded-lg transition-colors border border-transparent hover:border-blue-100 dark:hover:border-blue-800 flex items-center gap-2">
          <i class="fa-regular fa-copy"></i> Copy JSON
        </button>
      </div>
    </div>
  </div>

  <script>
    // --- State Management ---
    // Public demo key: keep API-restricted and quota-limited in Google Cloud.
    const DEMO_API_KEY = 'AIzaSyBVw-I5EtnusS6hy0ruPO-ovgYJf0E1edY';
    const KG_TYPE_ALIASES = {
      administrativearea: 'AdministrativeArea',
      amusementpark: 'AmusementPark',
      book: 'Book',
      city: 'City',
      civicstructure: 'CivicStructure',
      corporation: 'Corporation',
      country: 'Country',
      creativework: 'CreativeWork',
      educationalorganization: 'EducationalOrganization',
      event: 'Event',
      eventvenue: 'EventVenue',
      governmentorganization: 'GovernmentOrganization',
      landmarksorhistoricalbuildings: 'LandmarksOrHistoricalBuildings',
      localbusiness: 'LocalBusiness',
      movie: 'Movie',
      musicalbum: 'MusicAlbum',
      musicgroup: 'MusicGroup',
      musicrecording: 'MusicRecording',
      musicvenue: 'MusicVenue',
      organization: 'Organization',
      periodical: 'Periodical',
      person: 'Person',
      place: 'Place',
      product: 'Product',
      sportsactivitylocation: 'SportsActivityLocation',
      sportsteam: 'SportsTeam',
      stadiumorarena: 'StadiumOrArena',
      thing: 'Thing',
      touristattraction: 'TouristAttraction',
      tvseries: 'TVSeries'
    };
    window.fullResponseData = null;
    let activeSearchRequestId = 0;
    const SEARCH_HISTORY_KEY = 'kg_search_history';
    const LEGACY_API_KEY_STORAGE_KEY = 'kg_api_key';

    // --- Initialization ---
    document.addEventListener('DOMContentLoaded', () => {
      loadSettings();
      setupTheme();
      renderHistory();
      
      // Check URL params for shared searches
      const urlParams = new URLSearchParams(window.location.search);
      const queryParam = urlParams.get('q');
      if (queryParam) {
        document.getElementById('searchQuery').value = queryParam;
        toggleClearBtn();
        // Give time for UI to settle before auto-searching
        setTimeout(() => {
            if(DEMO_API_KEY) initiateSearch();
            else showToast('Demo API key is not configured', 'error');
        }, 500);
      }
    });

    // --- Theme Logic ---
    function setupTheme() {
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        
        // Check local storage or system preference
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
        } else {
            html.classList.remove('dark');
        }

        themeToggle.addEventListener('click', () => {
            html.classList.toggle('dark');
            localStorage.theme = html.classList.contains('dark') ? 'dark' : 'light';
        });
    }

    // --- Input Handling ---
    document.getElementById('searchQuery').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') initiateSearch();
    });

    function toggleClearBtn() {
      const query = document.getElementById('searchQuery').value;
      const btn = document.getElementById('clearSearchBtn');
      query.length > 0 ? btn.classList.remove('hidden') : btn.classList.add('hidden');
    }

    function clearSearch() {
      const input = document.getElementById('searchQuery');
      input.value = '';
      input.focus();
      toggleClearBtn();
      // Update URL to remove query
      const url = new URL(window.location);
      url.searchParams.delete('q');
      window.history.pushState({}, '', url);
    }

    function loadSettings() {
      const note = document.getElementById('apiKeyNote');
      const noteTitle = document.getElementById('apiKeyNoteTitle');
      const noteText = document.getElementById('apiKeyNoteText');
      safeRemoveStorageItem(LEGACY_API_KEY_STORAGE_KEY);

      if (DEMO_API_KEY) {
        noteTitle.textContent = 'Demo API Key Active:';
        noteText.textContent = 'Public demo key is used automatically.';
      } else {
        noteTitle.textContent = 'Demo API Key Missing:';
        noteText.textContent = 'Add a demo key in the app source before searching.';
      }
      note.classList.remove('hidden');
    }

    function addToHistory(query) {
      if(!query) return;
      let history = getSearchHistory();
      history = history.filter(q => q.toLowerCase() !== query.toLowerCase());
      history.unshift(query);
      if (history.length > 8) history = history.slice(0, 8);
      saveSearchHistory(history);
      renderHistory();
    }

    function renderHistory() {
      const history = getSearchHistory();
      const list = document.getElementById('recentSearchesList');
      const container = document.getElementById('recentSearchesContainer');
      
      list.replaceChildren();
      if (history.length === 0) {
        container.classList.add('hidden');
        return;
      }
      container.classList.remove('hidden');
      
      // Add "Clear" button first
      const clearBtn = document.createElement('button');
      clearBtn.className = "text-xs font-semibold text-red-400 hover:text-red-600 px-3 py-1.5 transition-colors whitespace-nowrap";
      clearBtn.innerHTML = '<i class="fa-solid fa-trash-can mr-1"></i> Clear';
      clearBtn.onclick = () => {
          safeRemoveStorageItem(SEARCH_HISTORY_KEY);
          renderHistory();
      };
      list.appendChild(clearBtn);

      history.forEach(q => {
        const btn = document.createElement('button');
        btn.className = "text-xs bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 px-3 py-1.5 rounded-full transition-colors border border-slate-200 dark:border-slate-600 whitespace-nowrap";
        btn.textContent = q;
        btn.onclick = () => {
          document.getElementById('searchQuery').value = q;
          toggleClearBtn();
          initiateSearch();
        };
        list.appendChild(btn);
      });
    }

    // --- Core Search Logic ---
    async function initiateSearch() {
      const query = document.getElementById('searchQuery').value.trim();
      const limit = document.getElementById('limit').value.trim();
      const languages = splitFilterValues(document.getElementById('languages').value, normalizeLanguageFilter);
      const types = splitFilterValues(document.getElementById('types').value, normalizeTypeFilter);

      if (!query) {
        showToast('Please enter a search query', 'error');
        return;
      }
      if (!DEMO_API_KEY) {
        showToast('Demo API key is not configured', 'error');
        return;
      }

      const requestId = ++activeSearchRequestId;
      safeRemoveStorageItem(LEGACY_API_KEY_STORAGE_KEY);
      addToHistory(query);

      // Update URL without reload
      const url = new URL(window.location);
      url.searchParams.set('q', query);
      window.history.pushState({}, '', url);

      // UI States
      document.getElementById('resultsContainer').replaceChildren();
      document.getElementById('skeletonLoader').classList.remove('hidden');
      document.getElementById('skeletonLoader').classList.add('grid');
      document.getElementById('resultControls').classList.add('hidden');
      document.getElementById('searchBtn').disabled = true;
      document.getElementById('searchBtn').innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';

      // --- SMART ID DETECTION START ---
      // Check if input looks like an Entity ID (e.g., /m/05f4p or kg:/m/05f4p)
      // Allows optional 'kg:' prefix, then requires /m/ or /g/ followed by chars
      const idRegex = /^(kg:)?(\/[mg]\/[a-zA-Z0-9_\-]+)$/i;
      const idMatch = query.match(idRegex);

      const apiUrl = new URL('https://kgsearch.googleapis.com/v1/entities:search');
      apiUrl.searchParams.set('key', DEMO_API_KEY);
      apiUrl.searchParams.set('indent', 'true');
      if (limit) apiUrl.searchParams.set('limit', limit);
      
      if (idMatch) {
        // It is an ID! Use 'ids' parameter and strip 'kg:' if present
        const cleanId = idMatch[2]; // Group 2 is the /m/... part
        apiUrl.searchParams.set('ids', cleanId);
        showToast('Searching by Entity ID...', 'info');
      } else {
        // Standard text search
        apiUrl.searchParams.set('query', query);
      }
      // --- SMART ID DETECTION END ---

      languages.forEach(language => apiUrl.searchParams.append('languages', language));
      types.forEach(type => apiUrl.searchParams.append('types', type));

      try {
        const response = await fetch(apiUrl.toString());
        const data = await response.json();

        if (requestId !== activeSearchRequestId) return;
        if (!response.ok) throw new Error(data.error ? data.error.message : 'Network response was not ok');
        
        window.fullResponseData = data;
        renderResults(data);
      } catch (error) {
        if (requestId !== activeSearchRequestId) return;
        console.error(error);
        const message = error.message || 'Search failed';
        showToast(message, 'error');
        renderError(message);
      } finally {
        if (requestId !== activeSearchRequestId) return;
        document.getElementById('skeletonLoader').classList.add('hidden');
        document.getElementById('skeletonLoader').classList.remove('grid');
        document.getElementById('searchBtn').disabled = false;
        document.getElementById('searchBtn').innerHTML = '<span>Explore</span><i class="fa-solid fa-rocket"></i>';
      }
    }

    function renderResults(data) {
      const container = document.getElementById('resultsContainer');
      const items = Array.isArray(data.itemListElement) ? data.itemListElement : [];
      container.replaceChildren();

      if (items.length === 0) {
        container.appendChild(createEmptyState('No results found for this query.'));
        return;
      }

      document.getElementById('resultControls').classList.remove('hidden');
      document.getElementById('resultControls').classList.add('flex');
      document.getElementById('countHeader').innerText = `Found ${items.length} entities`;

      items.forEach((item, index) => {
        const entity = item.result || {};
        const scoreValue = Number(item.resultScore);
        const score = Number.isFinite(scoreValue) ? Math.round(scoreValue) : 0;
        
        // Data Extraction
        const name = asDisplayText(entity.name, 'Unknown');
        const description = asDisplayText(entity.description, 'No description');
        const detailedDesc = asDisplayText(entity.detailedDescription ? entity.detailedDescription.articleBody : '', '');
        const officialUrl = getSafeHttpsUrl(entity.url);
        const sourceUrl = getSafeHttpsUrl(entity.detailedDescription ? entity.detailedDescription.url : '');
        const sourceLicenseUrl = getSafeHttpsUrl(entity.detailedDescription ? entity.detailedDescription.license : '');
        const imageLicenseUrl = getSafeHttpsUrl(entity.image ? entity.image.license : '');
        const imageUrl = getSafeHttpsUrl(entity.image ? entity.image.contentUrl : '');
        const id = asDisplayText(entity['@id'], '');
        const types = entity['@type'] || [];
        const typeArray = Array.isArray(types) ? types : [types];

        const card = createResultCard({
          imageUrl,
          name,
          id,
          score,
          typeArray,
          description,
          detailedDesc,
          officialUrl,
          sourceUrl,
          sourceLicenseUrl,
          imageLicenseUrl,
          index
        });
        container.appendChild(card);
      });
      
      window.currentData = items;
    }

    // --- Helper Functions ---
    function triggerSearch(term) {
        document.getElementById('searchQuery').value = term;
        toggleClearBtn();
        initiateSearch();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function viewRawJson(index) {
      const item = window.currentData[index];
      const modal = document.getElementById('jsonModal');
      const content = document.getElementById('modalContent');
      
      content.innerHTML = syntaxHighlight(JSON.stringify(item, null, 2));
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    async function copyModalContent() {
      const content = document.getElementById('modalContent').textContent;
      try {
        await navigator.clipboard.writeText(content);
        
        // Visual feedback on the button
        const btn = document.getElementById('copyBtn');
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
        btn.classList.add('text-green-600', 'dark:text-green-400');
        
        setTimeout(() => {
          btn.innerHTML = originalHtml;
          btn.classList.remove('text-green-600', 'dark:text-green-400');
        }, 2000);
        
        showToast('JSON copied to clipboard', 'success');
      } catch (err) {
        console.error('Failed to copy:', err);
        showToast('Failed to copy to clipboard', 'error');
      }
    }

    function closeModal() {
      const modal = document.getElementById('jsonModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function downloadAllResults() {
        if (!window.fullResponseData) return;
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(window.fullResponseData, null, 2));
        const el = document.createElement('a');
        el.href = dataStr;
        el.download = `kg_results_${Date.now()}.json`;
        el.click();
    }

    // --- Utilities ---
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      
      const colors = type === 'error' 
        ? 'bg-red-500 text-white shadow-red-500/30' 
        : 'bg-slate-800 dark:bg-white text-white dark:text-slate-900 shadow-xl';
      
      const icon = document.createElement('i');
      icon.className = type === 'error' ? 'fa-solid fa-circle-exclamation' : 'fa-solid fa-circle-info';
      const text = document.createElement('span');
      text.textContent = String(message);

      toast.className = `${colors} px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 text-sm font-medium transform transition-all duration-300 translate-y-10 opacity-0 pointer-events-auto min-w-[300px]`;
      toast.append(icon, text);
      
      container.appendChild(toast);
      
      // Animate In
      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-10', 'opacity-0');
      });

      // Remove after 3s
      setTimeout(() => {
        toast.classList.add('translate-y-5', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function syntaxHighlight(json) {
      json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
        let cls = 'json-value';
        if (/^"/.test(match)) {
          if (/:$/.test(match)) cls = 'json-key';
          else cls = 'json-string';
        }
        return '<span class="' + cls + '">' + match + '</span>';
      });
    }

    function getSearchHistory() {
      try {
        const parsed = JSON.parse(localStorage.getItem(SEARCH_HISTORY_KEY) || '[]');
        if (!Array.isArray(parsed)) throw new Error('Search history is not an array');

        return parsed
          .filter(item => typeof item === 'string')
          .map(item => item.trim())
          .filter(Boolean)
          .slice(0, 8);
      } catch {
        safeRemoveStorageItem(SEARCH_HISTORY_KEY);
        return [];
      }
    }

    function saveSearchHistory(history) {
      try {
        localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(history));
      } catch {
        // Ignore storage failures; recent searches are a convenience only.
      }
    }

    function safeRemoveStorageItem(key) {
      try {
        localStorage.removeItem(key);
      } catch {
        // Ignore storage failures; the app can run without this cleanup.
      }
    }

    function asDisplayText(value, fallback) {
      if (typeof value === 'string' && value.trim()) return value;
      if (typeof value === 'number' || typeof value === 'boolean') return String(value);
      if (Array.isArray(value)) {
        const values = value.map(item => asDisplayText(item, '')).filter(Boolean);
        return [...new Set(values)].join(' / ') || fallback;
      }
      if (value && typeof value === 'object' && typeof value['@value'] === 'string') {
        return value['@value'];
      }
      return fallback;
    }

    function splitFilterValues(value, normalize = item => item) {
      if (typeof value !== 'string') return [];
      return value
        .split(',')
        .map(item => item.trim())
        .map(normalize)
        .filter(Boolean);
    }

    function normalizeLanguageFilter(value) {
      return value.toLowerCase();
    }

    function normalizeTypeFilter(value) {
      const aliasKey = value.replace(/[^a-z0-9]/gi, '').toLowerCase();
      if (KG_TYPE_ALIASES[aliasKey]) return KG_TYPE_ALIASES[aliasKey];
      return value
        .split(/[\s_-]+/)
        .filter(Boolean)
        .map(part => part.charAt(0).toUpperCase() + part.slice(1).toLowerCase())
        .join('');
    }

    function getSafeHttpsUrl(value) {
      if (typeof value !== 'string' || !value.trim()) return '';
      try {
        const url = new URL(value, window.location.href);
        return url.protocol === 'https:' ? url.href : '';
      } catch {
        return '';
      }
    }

    function createIcon(className) {
      const icon = document.createElement('i');
      icon.className = className;
      return icon;
    }

    function createEmptyState(message) {
      const wrapper = document.createElement('div');
      wrapper.className = 'text-center py-12 bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-dashed border-slate-300 dark:border-slate-700';
      const text = document.createElement('p');
      text.className = 'text-slate-500';
      text.textContent = message;
      wrapper.appendChild(text);
      return wrapper;
    }

    function renderError(message) {
      const wrapper = document.createElement('div');
      wrapper.className = 'text-center py-12 bg-red-50 dark:bg-red-900/10 rounded-xl border border-red-100 dark:border-red-900/30';
      const icon = createIcon('fa-solid fa-triangle-exclamation text-3xl text-red-500 mb-3');
      const title = document.createElement('p');
      title.className = 'text-red-600 dark:text-red-400 font-medium';
      title.textContent = 'Search Failed';
      const detail = document.createElement('p');
      detail.className = 'text-red-400 dark:text-red-500/70 text-sm mt-1';
      detail.textContent = message;
      wrapper.append(icon, title, detail);
      document.getElementById('resultsContainer').replaceChildren(wrapper);
    }

    function createImageFallback() {
      const fallback = document.createElement('div');
      fallback.className = 'w-full h-full flex items-center justify-center text-slate-300 dark:text-slate-600';
      fallback.appendChild(createIcon('fa-regular fa-image text-2xl'));
      return fallback;
    }

    function createImageSection(imageUrl, imageAlt) {
      const section = document.createElement('div');
      section.className = 'w-full md:w-48 h-48 md:h-auto bg-slate-100 dark:bg-slate-900 relative overflow-hidden flex-shrink-0';
      const image = document.createElement('img');
      image.src = imageUrl;
      image.alt = imageAlt ? `${imageAlt} thumbnail` : '';
      image.loading = 'lazy';
      image.className = 'w-full h-full object-cover transition-transform duration-500 group-hover:scale-110';
      image.addEventListener('error', () => section.replaceChildren(createImageFallback()));
      section.appendChild(image);
      return section;
    }

    function createExternalLink(url, label, iconClass, className) {
      const link = document.createElement('a');
      link.href = url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.className = className;
      link.append(createIcon(iconClass), document.createTextNode(` ${label}`));
      return link;
    }

    function createResultCard({
      imageUrl,
      name,
      id,
      score,
      typeArray,
      description,
      detailedDesc,
      officialUrl,
      sourceUrl,
      sourceLicenseUrl,
      imageLicenseUrl,
      index
    }) {
      const card = document.createElement('div');
      card.className = 'bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden hover:shadow-lg dark:hover:shadow-slate-900/50 transition-all duration-300 animate-fade-in-up flex flex-col md:flex-row group';
      card.style.animationDelay = `${index * 50}ms`;
      if (imageUrl) card.appendChild(createImageSection(imageUrl, name));

      const content = document.createElement('div');
      content.className = 'flex-1 p-5 flex flex-col relative';

      const header = document.createElement('div');
      header.className = 'flex justify-between items-start';
      const titleBlock = document.createElement('div');
      const title = document.createElement('h2');
      title.className = 'text-xl font-bold text-slate-800 dark:text-slate-100 mb-1 leading-tight';
      title.textContent = name;
      titleBlock.appendChild(title);

      if (id) {
        const idButton = document.createElement('button');
        idButton.className = 'text-xs font-mono text-slate-400 dark:text-slate-500 hover:text-blue-500 dark:hover:text-blue-400 transition-colors mb-2 block text-left';
        idButton.title = 'Click to search ID';
        idButton.append(createIcon('fa-solid fa-fingerprint mr-1'), document.createTextNode(id));
        idButton.addEventListener('click', () => triggerSearch(id));
        titleBlock.appendChild(idButton);
      }

      const scoreBadge = document.createElement('div');
      scoreBadge.className = 'bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 text-xs font-bold px-2 py-1 rounded flex items-center gap-1';
      scoreBadge.title = 'Relevance Score';
      scoreBadge.append(createIcon('fa-solid fa-star text-amber-400 text-[10px]'), document.createTextNode(` ${score}`));
      header.append(titleBlock, scoreBadge);

      const tags = document.createElement('div');
      tags.className = 'flex flex-wrap gap-2 mb-3';
      typeArray.map(type => asDisplayText(type, '')).filter(Boolean).forEach(type => {
        const button = document.createElement('button');
        button.className = 'text-[10px] uppercase font-bold tracking-wider text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 px-2 py-1 rounded border border-blue-100 dark:border-blue-800 hover:bg-blue-100 dark:hover:bg-blue-800 transition-colors';
        button.textContent = type;
        button.addEventListener('click', () => triggerSearch(type));
        tags.appendChild(button);
      });

      const descriptionText = document.createElement('p');
      descriptionText.className = 'text-slate-700 dark:text-slate-300 font-medium mb-2 text-sm';
      descriptionText.textContent = description;

      content.append(header, tags, descriptionText);

      if (detailedDesc) {
        const detail = document.createElement('p');
        detail.className = 'text-slate-500 dark:text-slate-400 text-sm mb-4 line-clamp-3 leading-relaxed';
        detail.textContent = detailedDesc;
        content.appendChild(detail);
      }

      if (sourceLicenseUrl || imageLicenseUrl) {
        const attribution = document.createElement('div');
        attribution.className = 'flex flex-wrap gap-3 mb-4 text-xs';
        const licenseClass = 'font-medium text-slate-400 hover:text-slate-600 dark:text-slate-500 dark:hover:text-slate-300 transition-colors flex items-center gap-1';
        if (sourceLicenseUrl) {
          attribution.appendChild(createExternalLink(sourceLicenseUrl, 'Source license', 'fa-solid fa-certificate', licenseClass));
        }
        if (imageLicenseUrl) {
          attribution.appendChild(createExternalLink(imageLicenseUrl, 'Image license', 'fa-regular fa-image', licenseClass));
        }
        content.appendChild(attribution);
      }

      const footer = document.createElement('div');
      footer.className = 'mt-auto pt-4 flex items-center justify-between gap-4 border-t border-slate-100 dark:border-slate-700';
      const actionLinks = document.createElement('div');
      actionLinks.className = 'flex flex-wrap gap-x-4 gap-y-2';
      const actionClass = 'text-sm font-semibold text-blue-600 dark:text-blue-400 hover:underline flex items-center gap-1';

      if (officialUrl) {
        actionLinks.appendChild(createExternalLink(officialUrl, 'Official site', 'fa-solid fa-globe', actionClass));
      }
      if (sourceUrl) {
        actionLinks.appendChild(createExternalLink(sourceUrl, 'Source', 'fa-solid fa-arrow-up-right-from-square', actionClass));
      }
      footer.appendChild(actionLinks);

      const jsonButton = document.createElement('button');
      jsonButton.className = 'text-xs font-semibold text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors flex items-center gap-1';
      jsonButton.append(createIcon('fa-solid fa-code'), document.createTextNode(' JSON'));
      jsonButton.addEventListener('click', () => viewRawJson(index));
      footer.appendChild(jsonButton);
      content.appendChild(footer);
      card.appendChild(content);
      return card;
    }

    // Modal Close Events
    document.getElementById('jsonModal').addEventListener('click', (e) => {
      if (e.target.id === 'jsonModal') closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });
  </script>
</body>
</html>
